# Последний overlay после базового, webhook и nginx Compose-файлов.
# Заменяет только max-bot, используя его существующие env, порт и сеть.
services:
  max-bot:
    image: max-glpi-bot:python-webhook
    build:
      context: ${MAX_BOT_PYTHON_CONTEXT:-/opt/max-bot/rcair-pgli/bot/python_webhook}
      dockerfile: Dockerfile
    command: ["python", "app.py"]
    entrypoint: []
    working_dir: /app
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:' + os.environ.get('PORT', '3000') + '/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
