# Docker DNS обновляет адрес upstream после пересоздания контейнера бота.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream max_bot_backend {
    zone max_bot_backend 64k;
    server max-bot:3000 resolve;
    keepalive 8;
}

# Без query, заголовков, секретов и содержимого сообщений.
log_format max_webhook '$remote_addr [$time_local] $host "$request_method $uri" '
                       '$status upstream=$upstream_status duration=$request_time';
error_log /dev/stderr warn;

server {
    listen 80;
    server_name botsupport.gov70.ru;
    access_log /dev/stdout max_webhook;
    return 301 https://botsupport.gov70.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name botsupport.gov70.ru;
    access_log /dev/stdout max_webhook;

    ssl_certificate /etc/nginx/tls/botsupport.gov70.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/botsupport.gov70.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location = /max/callback/ {
        limit_except POST { deny all; }
        proxy_pass http://max_bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_next_upstream off;
    }

    location / { return 404; }
}

# Только внутри контейнера: healthcheck проверяет и Nginx, и маршрут к боту.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;
    location = /health {
        proxy_pass http://max_bot_backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }
    location / { return 404; }
}
